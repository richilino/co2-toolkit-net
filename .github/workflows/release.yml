# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Release

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
      contents: write
      attestations: write
      packages: write
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
      with:
        egress-policy: audit
        
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore CO2Toolkit/CO2Toolkit.sln --locked-mode
      
    - name: Build
      run: dotnet pack CO2Toolkit/CO2Toolkit.sln --configuration Release

    - name: Generate SBOM from deps.json
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        file: CO2Toolkit/bin/Release/netstandard2.0/CO2Toolkit.deps.json
        format: 'spdx-json'
        artifact-name: "co2-toolkit-net.spdx.json"
        output-file: "${{ github.workspace }}/co2-toolkit-net.spdx.json"
        upload-artifact: true
        upload-release-assets: true

    - name: Extract release notes
      id: extract-release-notes
      uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3.1.0

    - name: Create Release with Latest Changelog
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: CO2Toolkit/bin/Release/*.nupkg
        body: ${{ steps.extract-release-notes.outputs.release_notes }}

    - name: Upload build artifact
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: CO2Toolkit/bin/Release/*.nupkg
        name: CO2Toolkit NuGet

    - name: Attest Build
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: 'CO2Toolkit/bin/Release/*.nupkg'

    - name: Attest SBOM
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
      with:
        subject-path: 'CO2Toolkit/bin/Release/*.nupkg'
        sbom-path: "${{ github.workspace }}/co2-toolkit-net.spdx.json"
    
    - name: Publish the package to nuget.org
      run: dotnet nuget push CO2Toolkit/bin/Release/*.nupkg -k $NUGET_AUTH_TOKEN --skip-duplicate
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.NUGET_TOKEN }}

    